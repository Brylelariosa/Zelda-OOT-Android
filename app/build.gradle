def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary

if (buildAsApplication) {
    apply plugin: 'com.android.application'
} else {
    apply plugin: 'com.android.library'
}

android {
    compileSdkVersion 31

    // libultraship's CrashHandler.h includes <execinfo.h>, which NDK r21 (the one AGP 7.0 falls back to) does not
    // ship. AGP ignores ANDROID_NDK_HOME, so the NDK has to be pinned here.
    // Keep this a plain quoted literal: the CI workflow greps this line to decide which NDK to install.
    ndkVersion "26.1.10909125"

    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.dishii.soh"
        }
        minSdkVersion 18
        targetSdkVersion 31
        versionCode 5
        versionName "1.2.1"

        // Same CMake arguments as the upstream Android port (Waterdish/Shipwright-Android).
        // USE_OPENGLES=ON switches libultraship to its OpenGL ES backend; without it gfx_opengl.cpp takes the desktop
        // path and includes <GL/glew.h>, which Android does not have.
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-23", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF", "-DUSE_OPENGLES=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.18.1"
        }
    }
}

    lintOptions {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
}

task wrapper(type: Wrapper) {
    gradleVersion = '7.3'
}

task prepareKotlinBuildScriptModel {
}
