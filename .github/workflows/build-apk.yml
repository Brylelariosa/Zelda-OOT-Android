name: Build APK

# Push a ZIP into uploads/ and this workflow builds an APK from it:
#   * a full Gradle project ZIP (contains settings.gradle)  -> that project is built, exactly as before
#   * a small "overlay" ZIP (no settings.gradle inside)     -> its files are copied over this repository's own project
#                                                              (submodules included) and the result is built
# "Run workflow" with no ZIP present builds the repository as it is.
#
# After a successful overlay build the overlay's files are committed to the repository (set COMMIT_OVERLAY to 'false'
# below to turn that off), so the changes stay and later builds include them without uploading the ZIP again. A failed
# build commits nothing. Files that lie inside a submodule cannot be committed to this repository and are skipped.

on:
  push:
    branches: [ '**' ]
    paths:
      - 'uploads/**'      # only trigger when a ZIP is pushed; old ZIPs never retrigger builds
  workflow_dispatch:
    inputs:
      build_type:
        description: 'release = optimised (use this for games); debug builds faster but runs far slower'
        type: choice
        options: [ release, debug ]
        default: release

# One build at a time per branch; a newer ZIP push waits instead of racing the cleanup commit.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      # Used when the project does not say otherwise:
      #   ABIs   - a 'buildAbis=' line in the project's gradle.properties wins (comma separated)
      #   NDK    - an 'ndkVersion' in app/build.gradle wins
      #   CMake  - a cmake 'version' in app/build.gradle wins
      DEFAULT_ABIS: arm64-v8a
      DEFAULT_NDK: 26.1.10909125
      DEFAULT_CMAKE: 3.22.1
      COMMIT_OVERLAY: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive   # a repository that uses submodules (e.g. libultraship) needs them for overlay / repo builds
          fetch-depth: 2          # lets the next step see which ZIP this push added

      # zip_path is exported as early as possible so the cleanup step
      # can delete the ZIP even if a later step fails.
      - name: Find and unzip the uploaded ZIP
        id: zip
        run: |
          ZIP=""
          # Prefer the ZIP this push added or changed; otherwise the newest ZIP in the repository.
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'uploads/*.zip' 2>/dev/null | head -1 || true)
          if [ -n "$CHANGED" ] && [ -f "$CHANGED" ]; then
            ZIP="$CHANGED"
          else
            ZIP=$(find . -maxdepth 3 -path './.git' -prune -o -type f -name "*.zip" -printf "%T@ %p\n" | sort -rn | head -1 | cut -d" " -f2- || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            echo "No ZIP found - the repository itself will be built as it is."
            exit 0
          fi
          ZIP_NAME=$(basename "$ZIP" .zip)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP" >> "$GITHUB_ENV"
          echo "has_zip=true" >> "$GITHUB_OUTPUT"
          echo "Found zip: $ZIP"
          # -DD = ignore the timestamps stored in the ZIP; extracted files get the extraction time.
          # ZIPs stamped ahead of the runner's clock make Ninja fail with
          # "build.ninja still dirty after 100 tries".
          unzip -q -DD "$ZIP" -d extracted

      # full    : the ZIP holds a whole Gradle project            -> build it
      # overlay : the ZIP holds only changed / new files          -> copy them over the repository's project, build that
      # repo    : there is no ZIP                                 -> build the repository as it is
      # The shallowest settings.gradle wins, so a nested sample project can never be picked by mistake.
      - name: Find project directory
        id: find_project
        env:
          HAS_ZIP: ${{ steps.zip.outputs.has_zip }}
        run: |
          shallowest_settings() {
            find "$1" -maxdepth "$2" \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path '*/.git/*' -not -path './extracted/*' \
              | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d" " -f2-
          }

          MODE=repo
          PROJECT_DIR=""
          if [ "$HAS_ZIP" = "true" ]; then
            RESULT=$(shallowest_settings extracted 4)
            if [ -n "$RESULT" ]; then
              MODE=full
              PROJECT_DIR=$(dirname "$RESULT")
            else
              MODE=overlay
            fi
          fi

          if [ "$MODE" != "full" ]; then
            BASE=$(shallowest_settings . 2)
            if [ -z "$BASE" ]; then
              echo "##[error]No settings.gradle found - not inside the ZIP and not in the repository."
              [ -d extracted ] && find extracted | sort
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BASE")
          fi

          if [ "$MODE" = "overlay" ]; then
            # A ZIP made by zipping a folder has one wrapper directory around the files; look through it.
            ROOT=extracted
            if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
              ONLY=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)
              if [ -n "$ONLY" ] && [ ! -e "$PROJECT_DIR/$(basename "$ONLY")" ]; then
                for ENTRY in "$ONLY"/* "$ONLY"/.[!.]*; do
                  [ -e "$ENTRY" ] || continue
                  if [ -e "$PROJECT_DIR/$(basename "$ENTRY")" ]; then ROOT="$ONLY"; fi
                done
              fi
            fi
            echo "overlay_root=$ROOT" >> "$GITHUB_OUTPUT"
            echo "Applying overlay from $ROOT onto $PROJECT_DIR:"
            (cd "$ROOT" && find . -type f | sort | head -100)
            # The ZIP can never replace the repository's history or its workflows. (tar rather than rsync: it is
            # always there, copes with dotfiles and keeps the fresh timestamps from unzip -DD.)
            if ! ( set -o pipefail; tar -C "$ROOT" --exclude='./.git' --exclude='./.github' -cf - . | tar -C "$PROJECT_DIR" -xf - ); then
              echo "##[error]Could not copy the overlay onto the project"
              exit 1
            fi
          fi

          echo "Mode: $MODE   Project at: $PROJECT_DIR"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Reads the project's own wishes (NDK, CMake, ABIs) so a project is built with the toolchain it expects.
      - name: Detect toolchain
        id: toolchain
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          FILES=()
          for F in "$PROJECT_DIR/app/build.gradle" "$PROJECT_DIR/app/build.gradle.kts" "$PROJECT_DIR/build.gradle" "$PROJECT_DIR/build.gradle.kts"; do
            if [ -f "$F" ]; then FILES+=("$F"); fi
          done

          NDK=""
          CMAKE_VER=""
          if [ "${#FILES[@]}" -gt 0 ]; then
            NDK=$(grep -hE "ndkVersion[[:space:]]*=?[[:space:]]*[\"'][0-9]+\.[0-9]+\.[0-9]+[\"']" "${FILES[@]}" | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1 || true)
            # the 'version "x.y.z"' line of the cmake block (versionCode / versionName do not match)
            CMAKE_VER=$(grep -hE "^[[:space:]]*version[[:space:]]*=?[[:space:]]*[\"'][0-9]+\.[0-9]+(\.[0-9]+)?[\"']" "${FILES[@]}" | head -1 | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1 || true)
          fi
          NDK=${NDK:-$DEFAULT_NDK}
          CMAKE_VER=${CMAKE_VER:-$DEFAULT_CMAKE}

          PROP_ABIS=$(grep -E '^buildAbis=' "$PROJECT_DIR/gradle.properties" 2>/dev/null | head -1 | cut -d= -f2 | tr -d '\r ' || true)
          ABIS=${PROP_ABIS:-$DEFAULT_ABIS}

          {
            echo "ndk=$NDK"
            echo "cmake=$CMAKE_VER"
            echo "abis=$ABIS"
          } >> "$GITHUB_OUTPUT"
          echo "NDK $NDK, CMake $CMAKE_VER, ABIs $ABIS, build type $BUILD_TYPE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache NDK and CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ steps.toolchain.outputs.ndk }}
            ${{ env.ANDROID_HOME }}/cmake/${{ steps.toolchain.outputs.cmake }}
          key: sdk-ndk-${{ steps.toolchain.outputs.ndk }}-cmake-${{ steps.toolchain.outputs.cmake }}

      - name: Install NDK and CMake
        env:
          NDK_VER: ${{ steps.toolchain.outputs.ndk }}
          CMAKE_VER: ${{ steps.toolchain.outputs.cmake }}
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
            echo "Installing NDK $NDK_VER..."
            sdkmanager --install "ndk;$NDK_VER"
          else
            echo "NDK $NDK_VER already present"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/cmake/$CMAKE_VER" ]; then
            echo "Installing CMake $CMAKE_VER..."
            sdkmanager --install "cmake;$CMAKE_VER"
          else
            echo "CMake $CMAKE_VER already present"
          fi
          {
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VER"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VER"
          } >> "$GITHUB_ENV"

      # Large C++ projects (a game engine, for instance) take ages to compile from scratch. ccache keeps the compiled
      # objects between runs, so a second build after a small change takes minutes instead of the better part of an hour.
      # CMake picks the launcher up from these environment variables, Gradle's CMake runs inherit them.
      - name: Set up ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.toolchain.outputs.ndk }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # ---------------------------------------------------------------- Rust (only for projects with a Cargo.toml)

      # A project that contains a Cargo.toml has a Rust native library: it is compiled with cargo-ndk below and
      # Gradle only packages it. Projects without a Cargo.toml build exactly as before.
      - name: Detect Rust project
        id: rust
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          CARGO_TOML=$(find "$PROJECT_DIR" -maxdepth 2 -name Cargo.toml -not -path '*/target/*' -not -path '*/.git/*' -not -path './extracted/*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d" " -f2-)
          if [ -n "$CARGO_TOML" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "cargo_dir=$(dirname "$CARGO_TOML")" >> "$GITHUB_OUTPUT"
            echo "Rust crate found at: $(dirname "$CARGO_TOML")"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml - plain Gradle project"
          fi

      # ABIs come from 'rustAbis=' in the project's gradle.properties (default arm64-v8a), the same line the
      # Gradle module reads, so the library and the APK always agree.
      - name: Resolve Rust ABIs and targets
        id: rust_cfg
        if: steps.rust.outputs.has_rust == 'true'
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          ABIS=$(grep -E '^rustAbis=' "$PROJECT_DIR/gradle.properties" 2>/dev/null | head -1 | cut -d= -f2 | tr -d '\r' | tr ',' ' ')
          if [ -z "$ABIS" ]; then ABIS="arm64-v8a"; fi
          TARGETS=""
          for A in $ABIS; do
            case "$A" in
              arm64-v8a)   TARGETS="$TARGETS aarch64-linux-android" ;;
              armeabi-v7a) TARGETS="$TARGETS armv7-linux-androideabi" ;;
              x86_64)      TARGETS="$TARGETS x86_64-linux-android" ;;
              x86)         TARGETS="$TARGETS i686-linux-android" ;;
              *) echo "##[warning]Unknown ABI '$A' in rustAbis - ignored" ;;
            esac
          done
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "ABIs: $ABIS"
          echo "Rust targets: $TARGETS"

      - name: Set up Rust toolchain
        if: steps.rust.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        if: steps.rust.outputs.has_rust == 'true'
        env:
          TARGETS: ${{ steps.rust_cfg.outputs.targets }}
        run: |
          read -ra TARGET_LIST <<< "$TARGETS"
          rustup target add "${TARGET_LIST[@]}"
          rustc --version
          cargo --version

      - name: Cache Rust build
        if: steps.rust.outputs.has_rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.rust.outputs.cargo_dir }}
          cache-on-failure: true

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        if: steps.rust.outputs.has_rust == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.rust.outputs.has_rust == 'true' && steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # Rust targets the most recent LTS NDK, newer than the one used for CMake projects above. The runner image
      # ships one (ANDROID_NDK_LATEST_HOME); otherwise r27 is installed.
      - name: Select NDK for Rust
        if: steps.rust.outputs.has_rust == 'true'
        run: |
          NDK=""
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          fi
          if [ -z "$NDK" ]; then
            echo "Installing NDK 27.2.12479018..."
            sdkmanager --install "ndk;27.2.12479018"
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "NDK for Rust: $NDK"
          echo "RUST_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # Logic tests (terrain, meshing, physics, saves...) run on the build machine. They never block the APK;
      # their result is only reported in this log.
      - name: Run Rust unit tests (non-blocking)
        if: steps.rust.outputs.has_rust == 'true'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ${{ steps.rust.outputs.cargo_dir }}
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee rust-test.log
          echo "---- test summary ----"
          grep -E "^test result|FAILED|panicked" rust-test.log || true

      - name: Build Rust library (cargo-ndk)
        id: rust_build
        if: steps.rust.outputs.has_rust == 'true'
        working-directory: ${{ steps.rust.outputs.cargo_dir }}
        env:
          ANDROID_NDK_HOME: ${{ env.RUST_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.RUST_NDK_HOME }}
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
          RUST_ABIS: ${{ steps.rust_cfg.outputs.abis }}
        run: |
          set -o pipefail
          JNI_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/jniLibs"
          mkdir -p "$JNI_DIR"
          ARGS=()
          for A in $RUST_ABIS; do ARGS+=(-t "$A"); done
          cargo ndk --version
          cargo ndk "${ARGS[@]}" -o "$JNI_DIR" build --release 2>&1 | tee rust-build.log
          echo "---- built libraries ----"
          find "$JNI_DIR" -name '*.so' -exec ls -la {} \;
          # Any library will do: the crate's name is the project's business, not this workflow's.
          if ! find "$JNI_DIR" -name '*.so' | grep -q .; then
            echo "##[error]cargo-ndk finished but produced no .so file"
            exit 1
          fi

      # ---------------------------------------------------------------- Gradle

      # Host-side unit tests of the on-screen controls' logic (about three seconds). Like the Rust tests they are
      # reported in this log and never block the APK. Projects without a tests/touch-controls folder skip this.
      - name: Run touch-control unit tests (non-blocking)
        continue-on-error: true
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          if [ -f tests/touch-controls/run_tests.sh ]; then
            sh tests/touch-controls/run_tests.sh
          else
            echo "No touch-control tests in this project"
          fi

      - name: Fetch gradle-wrapper.jar
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          JAR="gradle/wrapper/gradle-wrapper.jar"
          # A project that ships its own wrapper jar keeps it.
          if [ -f "$JAR" ] && [ "$(stat -c%s "$JAR")" -gt 10000 ]; then
            echo "Using the project's own gradle-wrapper.jar ($(stat -c%s "$JAR") bytes)"
            exit 0
          fi
          # Fetch the jar that matches the Gradle version the project asks for (default 8.6).
          GRADLE_VERSION=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -1 | sed 's/gradle-//' || true)
          GRADLE_VERSION=${GRADLE_VERSION:-8.6}
          case "$GRADLE_VERSION" in
            *.*.*) TAG="v${GRADLE_VERSION}" ;;
            *)     TAG="v${GRADLE_VERSION}.0" ;;
          esac
          mkdir -p gradle/wrapper
          echo "Downloading gradle-wrapper.jar for Gradle ${GRADLE_VERSION} (${TAG})..."
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/gradle/gradle/${TAG}/gradle/wrapper/gradle-wrapper.jar" \
            -o "$JAR"
          SIZE=$(stat -c%s "$JAR")
          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: gradle-wrapper.jar suspiciously small (${SIZE} bytes) — aborting"
            exit 1
          fi
          echo "Jar OK: ${SIZE} bytes"

      - name: Make gradlew executable
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: chmod +x gradlew && sed -i 's/\r//' gradlew

      - name: Decode keystore (if available)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Keystore decoded ✓"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "No KEYSTORE_BASE64 secret"
          fi

      # A release APK must be signed to be installable. Without your own key a throw-away one is generated, so the APK
      # installs, but every build gets a different signature: uninstall the previous build before installing a new one.
      # Add the KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to keep one signature.
      - name: Generate a throw-away signing key (release without a keystore secret)
        if: env.BUILD_TYPE == 'release' && env.HAS_KEYSTORE != 'true'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-release.jks" -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=CI Build,O=CI,C=US"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-release.jks" >> "$GITHUB_ENV"
          echo "CI_KEY=true" >> "$GITHUB_ENV"

      - name: Build APK
        id: build
        timeout-minutes: 150
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ABIS: ${{ steps.toolchain.outputs.abis }}
          HAS_RUST: ${{ steps.rust.outputs.has_rust }}
          RUST_ABIS: ${{ steps.rust_cfg.outputs.abis }}
        run: |
          # Build only the ABIs that are wanted: every extra ABI multiplies the compile time of a native project.
          if [ "$HAS_RUST" = "true" ]; then
            ABI_LIST=$(echo "$RUST_ABIS" | tr ' ' ',')
          else
            ABI_LIST="$ABIS"
          fi
          EXTRA=("-Pandroid.injected.build.abi=$ABI_LIST")
          # A Rust project's library was already built above; tell Gradle not to build it again.
          if [ "$HAS_RUST" = "true" ]; then
            EXTRA+=("-PrustPrebuilt=true")
          fi

          if [ "$BUILD_TYPE" = "release" ]; then
            if [ "$HAS_KEYSTORE" = "true" ]; then
              SIGN_PASS="$STORE_PASSWORD"; SIGN_ALIAS="$KEY_ALIAS"; SIGN_KEY_PASS="$KEY_PASSWORD"
            else
              SIGN_PASS="android"; SIGN_ALIAS="ci"; SIGN_KEY_PASS="android"
            fi
            ./gradlew assembleRelease --no-daemon --build-cache --parallel "${EXTRA[@]}" \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$SIGN_PASS" \
              -Pandroid.injected.signing.key.alias="$SIGN_ALIAS" \
              -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS"
          else
            ./gradlew assembleDebug --no-daemon --build-cache --parallel "${EXTRA[@]}"
          fi

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      # Saved even when the build fails or times out, so a re-run continues where this one stopped.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.toolchain.outputs.ndk }}-${{ github.run_id }}

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          APK_DIR="app/build/outputs/apk/$BUILD_TYPE"
          APK_PATH=$(find "$APK_DIR" -name "*.apk" | head -1)
          echo "APK type: $BUILD_TYPE"
          if [ -z "$APK_PATH" ]; then
            echo "##[error]Build finished but no APK was found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK: $APK_PATH ($SIZE bytes)"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          {
            echo "### APK built"
            echo "- **Type:** $BUILD_TYPE"
            echo "- **ABIs:** $ABIS_SUMMARY"
            echo "- **Size:** $((SIZE / 1024 / 1024)) MB"
            if [ "${CI_KEY:-}" = "true" ]; then
              echo "- **Signed with a throw-away key:** uninstall the previous build before installing this one (add the KEYSTORE_BASE64 secrets to avoid it)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ABIS_SUMMARY: ${{ steps.toolchain.outputs.abis }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name || 'repo' }}-${{ env.BUILD_TYPE }}-v${{ github.run_number }}
          path: ${{ steps.find_project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # R8/ProGuard's mapping.txt is only produced for release (minify enabled).
      # if-no-files-found is 'warn' so a build without minification doesn't fail here.
      - name: Upload mapping.txt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name || 'repo' }}-mapping-v${{ github.run_number }}
          path: ${{ steps.find_project.outputs.project_dir }}/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      # On failure, keep Gradle/test/lint reports and the cargo logs so the error can be inspected.
      - name: Upload build reports (on failure)
        if: failure() && steps.find_project.outputs.project_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name || 'repo' }}-build-reports-v${{ github.run_number }}
          path: |
            ${{ steps.find_project.outputs.project_dir }}/app/build/reports
            ${{ steps.find_project.outputs.project_dir }}/build/reports
            ${{ steps.find_project.outputs.project_dir }}/rust-build.log
            ${{ steps.find_project.outputs.project_dir }}/rust-test.log
          retention-days: 7
          if-no-files-found: ignore

      # Overlay builds only: once the APK has built, keep the overlay's files in the repository so the change is permanent.
      # Stages exactly the files the overlay carried - never build output, never anything inside a submodule.
      - name: Keep the overlay in the repository (successful overlay builds)
        if: success() && steps.find_project.outputs.mode == 'overlay' && env.COMMIT_OVERLAY == 'true'
        env:
          OVERLAY_ROOT: ${{ steps.find_project.outputs.overlay_root }}
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SUBMODULES=$(git submodule status 2>/dev/null | awk '{ print $2 }' || true)
          while IFS= read -r -d '' FILE; do
            REL="${FILE#./}"
            case "$REL" in .git/*|.github/*) continue ;; esac   # the same exclusions as when the overlay was applied
            TARGET="$REL"
            if [ "$PROJECT_DIR" != "." ]; then TARGET="$PROJECT_DIR/$REL"; fi
            INSIDE=false
            for SM in $SUBMODULES; do
              case "$TARGET" in "$SM"/*) INSIDE=true ;; esac
            done
            if [ "$INSIDE" = "true" ]; then
              echo "##[warning]$TARGET lies inside a submodule and is not committed"
              continue
            fi
            git add -f -- "$TARGET"
          done < <(cd "$OVERLAY_ROOT" && find . -type f -print0)

          if git diff --cached --quiet; then
            echo "The overlay changed nothing in the repository."
            exit 0
          fi
          git commit -q -m "ci: apply overlay $zip_name [skip ci]"
          for ATTEMPT in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Overlay committed to $BRANCH"
              exit 0
            fi
            echo "Push attempt $ATTEMPT failed (another commit landed first?), updating and retrying..."
            git pull --rebase --autostash origin "$BRANCH" || true
          done
          echo "##[warning]The APK is built, but the overlay could not be committed. Add the files to the repository by hand."

      # Delete the ZIP after the build finishes, pass OR fail, so a leftover
      # ZIP never retriggers this workflow. Skipped when the run is cancelled.
      # [skip ci] stops the deletion commit from creating a new run.
      # Done through the GitHub API instead of 'git rm' + 'git push': an overlay build leaves modified files in the
      # working tree, which would make 'git pull --rebase' refuse to run if the push raced another commit.
      - name: Clean up - delete zip (success or failure)
        if: (success() || failure()) && steps.zip.outputs.has_zip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # zip_path comes from the environment (set by the first step), never pasted into the script text.
          ZIP="$zip_path"
          if [ -z "$ZIP" ] || ! git cat-file -e "HEAD:$ZIP" 2>/dev/null; then
            echo "ZIP is not tracked by git; nothing to delete"
            exit 0
          fi
          BLOB=$(git rev-parse "HEAD:$ZIP")
          ENCODED=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$ZIP")
          for ATTEMPT in 1 2 3; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/$ENCODED" \
                 -f message="ci: remove $ZIP after build #${{ github.run_number }} ($JOB_STATUS) [skip ci]" \
                 -f sha="$BLOB" -f branch="$BRANCH" > /dev/null; then
              echo "Deleted $ZIP from $BRANCH"
              exit 0
            fi
            echo "Delete attempt $ATTEMPT failed, retrying..."
            sleep $((ATTEMPT * 3))
          done
          echo "##[warning]Could not delete $ZIP - delete it by hand so it does not retrigger the build"
